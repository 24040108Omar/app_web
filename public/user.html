<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cursos | Usuario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="nav">
    <div class="nav__brand">Cursos</div>
    <div class="nav__actions">
      <button class="btn" id="btnLogout">Cerrar sesión</button>

  </header>

  <main class="wrap">

    </section>

    <section class="card">
      <h3>Tu sesión</h3>
      <p class="muted" id="sessionInfo"></p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
